name: sdwan-client-m0

on:
  push:
    paths:
      - "contracts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

defaults:
  run:
    working-directory: .

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run audit
      - run: node scripts/check_test_key_isolation.mjs
